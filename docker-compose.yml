version: '3.8'

services:
  web:
    build: .
    container_name: study_planner_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             uvicorn study_planner.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-study-planner-ai-prod-key-xyz-2026
      - DATABASE_URL=postgres://studyuser:studypass123@postgres:5432/study_planner_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: study_planner_postgres
    restart: always
    environment:
      POSTGRES_DB: study_planner_db
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: studypass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyuser -d study_planner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: study_planner_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build: .
    container_name: study_planner_celery_worker
    restart: always
    command: celery -A study_planner worker -l info --pool=threads
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-study-planner-ai-prod-key-xyz-2026
      - DATABASE_URL=postgres://studyuser:studypass123@postgres:5432/study_planner_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  celery_beat:
    build: .
    container_name: study_planner_celery_beat
    restart: always
    command: celery -A study_planner beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-study-planner-ai-prod-key-xyz-2026
      - DATABASE_URL=postgres://studyuser:studypass123@postgres:5432/study_planner_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
