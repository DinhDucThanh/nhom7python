{% extends 'base.html' %}

{% block title %}Đăng ký tài khoản - Smart Study Planner{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 items-center justify-center text-white shadow-xl shadow-brand-500/30 mb-4">
            <i data-lucide="user-plus" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Tạo tài khoản học tập mới</h2>
        <p class="mt-1 text-sm text-slate-500">Bắt đầu hành trình quản lý thời gian và nâng cao năng suất</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-100 sm:px-10">
            <form method="POST" action="{% url 'register' %}" class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Họ & Tên đệm</label>
                        <input name="last_name" type="text" placeholder="Nguyễn Văn"
                               class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tên</label>
                        <input name="first_name" type="text" required placeholder="An"
                               class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tên đăng nhập</label>
                    <input name="username" type="text" required placeholder="nhap_username"
                           class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email</label>
                    <input name="email" type="email" required placeholder="student@example.com"
                           class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Mật khẩu</label>
                    <input name="password" type="password" required placeholder="Tối thiểu 6 ký tự"
                           class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Xác nhận mật khẩu</label>
                    <input name="password_confirm" type="password" required placeholder="Nhập lại mật khẩu"
                           class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-md shadow-brand-500/20 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all active:scale-[0.99]">
                        Tạo tài khoản & Đăng nhập
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-slate-100">
                <span class="text-xs text-slate-500">Đã có tài khoản? </span>
                <a href="{% url 'login' %}" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
