services:
  - type: web
    name: study-planner-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && python manage.py seed_data && uvicorn study_planner.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: study-planner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: study-planner-redis
          property: connectionString

databases:
  - name: study-planner-db
    databaseName: study_planner_db
    user: studyuser
    plan: free
